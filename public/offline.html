<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="theme-color"
            content="#f5f3ef"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#141210"
            media="(prefers-color-scheme: dark)"
        />
        <title>Offline - YardRunner</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <style>
            :root {
                --bg: #f5f3ef;
                --card: #ffffff;
                --text: #1c1f1d;
                --muted: #5f625f;
                --border: #e2ded6;
                --accent: #c2410c;
                --accent-text: #ffffff;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #141210;
                    --card: #1d1b18;
                    --text: #eeefec;
                    --muted: #a29d94;
                    --border: #2e2b27;
                    --accent: #f26b1d;
                    --accent-text: #141210;
                }
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: max(24px, env(safe-area-inset-top)) 16px
                    max(24px, env(safe-area-inset-bottom));
                background: var(--bg);
                color: var(--text);
                font-family:
                    'IBM Plex Sans',
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            main {
                width: 100%;
                max-width: 380px;
                padding: 28px 24px;
                border: 1px solid var(--border);
                border-radius: 14px;
                background: var(--card);
                text-align: center;
            }

            svg {
                display: block;
                margin: 0 auto 18px;
            }

            h1 {
                margin: 0 0 8px;
                font-size: 20px;
                font-weight: 600;
                letter-spacing: -0.01em;
            }

            p {
                margin: 0 0 20px;
                color: var(--muted);
                font-size: 15px;
                line-height: 1.5;
            }

            button {
                width: 100%;
                min-height: 48px;
                border: 0;
                border-radius: 10px;
                background: var(--accent);
                color: var(--accent-text);
                font: inherit;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
            }

            button:focus-visible {
                outline: 3px solid var(--accent);
                outline-offset: 3px;
            }

            .status {
                margin: 14px 0 0;
                font-size: 13px;
            }
        </style>
    </head>
    <body>
        <main>
            <svg
                width="56"
                height="56"
                viewBox="0 0 160 160"
                aria-hidden="true"
            >
                <rect width="160" height="160" rx="36" fill="#1C1F1D" />
                <g transform="translate(20 20)" fill="#EEEFEC">
                    <rect x="10" y="2" width="44" height="20" rx="3" />
                    <rect x="58" y="2" width="28" height="20" rx="3" />
                    <rect x="22" y="26" width="28" height="20" rx="3" />
                    <rect x="54" y="26" width="44" height="20" rx="3" />
                    <rect x="34" y="50" width="44" height="20" rx="3" />
                    <rect
                        x="82"
                        y="50"
                        width="28"
                        height="20"
                        rx="3"
                        fill="#F26B1D"
                    />
                    <rect x="22" y="74" width="28" height="20" rx="3" />
                    <rect x="54" y="74" width="44" height="20" rx="3" />
                    <rect x="10" y="98" width="44" height="20" rx="3" />
                    <rect x="58" y="98" width="28" height="20" rx="3" />
                </g>
            </svg>
            <h1>No connection</h1>
            <p>
                YardRunner needs a signal to load this screen. Nothing you saved
                is lost. It’ll pick up where you left off once you’re back
                online.
            </p>
            <button type="button" id="retry">Try again</button>
            <p class="status" id="status" role="status" aria-live="polite"></p>
        </main>
        <script>
            (function () {
                var status = document.getElementById('status');

                function retry() {
                    if (navigator.onLine === false) {
                        status.textContent =
                            'Still offline. This page reloads by itself when the signal comes back.';
                        return;
                    }

                    status.textContent = 'Reconnecting…';
                    window.location.reload();
                }

                document
                    .getElementById('retry')
                    .addEventListener('click', retry);
                window.addEventListener('online', function () {
                    window.location.reload();
                });
            })();
        </script>
    </body>
</html>
