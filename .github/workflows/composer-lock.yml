name: composer lock

# Composer packages can't be resolved from every dev environment, so when
# composer.json changes without its lock, this resolves the lock in CI and
# commits it back to the branch.
on:
  push:
    paths:
      - composer.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Update the lock if it's stale
        run: |
          if composer validate --no-check-publish --no-check-all 2>&1 | grep -qi 'lock file is not up to date'; then
            composer update --no-install --no-scripts --no-plugins --with-all-dependencies $(php -r '$j=json_decode(file_get_contents("composer.json"),true); $l=json_decode(file_get_contents("composer.lock"),true); $locked=array_column(array_merge($l["packages"],$l["packages-dev"]),"name"); echo implode(" ", array_diff(array_keys(array_merge($j["require"],$j["require-dev"]??[])), $locked, ["php"]));')
          fi

      - name: Commit the lock
        run: |
          if ! git diff --quiet composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update composer.lock" composer.lock
            git push
          fi
