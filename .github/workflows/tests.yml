name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Plain bash (no -e/pipefail): each step captures its own exit code so
    # it can save the log for the failure report.
    defaults:
      run:
        shell: bash --noprofile --norc {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        id: setup
        run: composer setup 2>&1 | tee "$RUNNER_TEMP/setup.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/setup.failed"; exit $s

      # Each check runs on its own (so one failure doesn't hide the others)
      # and posts its output as annotations when it fails.

      - name: Lint and format (JS)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check 2>&1 | tee "$RUNNER_TEMP/js-lint.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/js-lint.failed"; exit $s

      - name: Types (TS)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run types:check 2>&1 | tee "$RUNNER_TEMP/ts.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/ts.failed"; exit $s

      - name: Pint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/pint --test 2>&1 | tee "$RUNNER_TEMP/pint.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/pint.failed"; exit $s

      - name: PHPStan
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=raw 2>&1 | tee "$RUNNER_TEMP/phpstan.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/phpstan.failed"; exit $s

      - name: PHPUnit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          php artisan config:clear --ansi || exit 1
          php artisan test 2>&1 | tee "$RUNNER_TEMP/phpunit.log"; s=${PIPESTATUS[0]}; [ "$s" -eq 0 ] || touch "$RUNNER_TEMP/phpunit.failed"; exit $s

      - name: Report failures
        if: ${{ failure() }}
        run: |
          for check in setup js-lint ts pint phpstan phpunit; do
            if [ -f "$RUNNER_TEMP/$check.failed" ]; then
              .github/scripts/annotate.sh "$check" "$RUNNER_TEMP/$check.log" || true
            fi
          done
